<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机构筛选器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>机构筛选器</h1>
            <p class="subtitle">输入5位邮编查询周边服务机构</p>
        </header>

        <section class="filter-section">
            <div class="input-group">
                <label for="zipInput">邮政编码 (ZIP Code)：</label>
                <input 
                    type="text" 
                    id="zipInput" 
                    placeholder="请输入5位数字邮编 (例如: 77001)" 
                    maxLength="5"
                    pattern="\d{5}"
                >
                <button id="searchBtn">查询</button>
            </div>
        </section>

        <main class="results-section">
            <div id="loading" class="hidden">加载中...</div>
            <div id="stats" class="stats-info"></div>
            <div id="cardsContainer" class="cards-grid"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
